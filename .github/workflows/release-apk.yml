name: Build IPTV Release APKs and AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret $name is not configured."
              exit 1
            fi
          done

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"

      - name: Build signed release APKs and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean :core:test :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Prepare release APKs and AAB
        run: |
          set -eu
          mkdir -p dist
          count=0
          for apk_path in app/build/outputs/apk/release/*.apk; do
            test -e "$apk_path" || continue
            name="$(basename "$apk_path" .apk)"
            case "$name" in
              app-*-unsigned) echo "::error::$name.apk is unsigned (no release signing config applied)"; exit 1 ;;
              app-*-release) ;;
              *) echo "::error::Unexpected release APK name: $name.apk"; exit 1 ;;
            esac
            abi="${name#app-}"
            abi="${abi%-release}"
            cp "$apk_path" "dist/IPTV-$abi-release.apk"
            test -s "dist/IPTV-$abi-release.apk"
            count=$((count + 1))
          done
          test "$count" -gt 0 || { echo "No release APK was produced"; exit 1; }
          test -s dist/IPTV-universal-release.apk || { echo "Universal release APK is missing"; exit 1; }
          aab_path="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$aab_path" || { echo "No release AAB was produced"; exit 1; }
          cp "$aab_path" dist/IPTV-release.aab
          test -s dist/IPTV-release.aab

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: IPTV-release-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: IPTV-play-aab-${{ github.run_number }}
          path: dist/IPTV-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.apk \
            dist/IPTV-release.aab \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
