name: Release to Google Play closed testing

# Bumps appVersionCode (versionName is left as is), builds a signed AAB, commits and tags the bump,
# uploads the bundle to Google Play closed testing and publishes a GitHub Release.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Require a branch
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Run this workflow from a branch (normally main), not a tag."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret $name is not configured."
              exit 1
            fi
          done

      # versionName is maintained by hand; only appVersionCode is bumped here (versionCode follows it).
      - name: Bump appVersionCode
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current_code="$(sed -nE 's/^val appVersionCode = ([0-9]+)$/\1/p' app/build.gradle.kts)"
          version_name="$(sed -nE 's/^ *versionName = "([^"]+)"$/\1/p' app/build.gradle.kts)"
          [[ -n "$current_code" && -n "$version_name" ]] || { echo "::error::Could not read version from app/build.gradle.kts"; exit 1; }

          new_code=$((current_code + 1))
          sed -i -E "s/^(val appVersionCode = )[0-9]+$/\1$new_code/" app/build.gradle.kts
          grep -qE "^val appVersionCode = $new_code$" app/build.gradle.kts
          git diff --stat

          tag="v$version_name-$new_code"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          echo "code=$new_code" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $version_name ($new_code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"

      - name: Build signed release APKs and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean :core:test :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Prepare release APKs and AAB
        run: |
          set -eu
          mkdir -p dist
          count=0
          for apk_path in app/build/outputs/apk/release/*.apk; do
            test -e "$apk_path" || continue
            name="$(basename "$apk_path" .apk)"
            case "$name" in
              app-*-unsigned) echo "::error::$name.apk is unsigned (no release signing config applied)"; exit 1 ;;
              app-*-release) ;;
              *) echo "::error::Unexpected release APK name: $name.apk"; exit 1 ;;
            esac
            abi="${name#app-}"
            abi="${abi%-release}"
            cp "$apk_path" "dist/IPTV-$abi-release.apk"
            test -s "dist/IPTV-$abi-release.apk"
            count=$((count + 1))
          done
          test "$count" -gt 0 || { echo "No release APK was produced"; exit 1; }
          test -s dist/IPTV-universal-release.apk || { echo "Universal release APK is missing"; exit 1; }
          aab_path="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$aab_path" || { echo "No release AAB was produced"; exit 1; }
          cp "$aab_path" dist/IPTV-release.aab
          test -s dist/IPTV-release.aab

      # Pushed before uploading: an appVersionCode committed but never uploaded is harmless,
      # whereas one uploaded but not committed would make the next run collide on Play.
      - name: Commit and tag appVersionCode bump
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: release $VERSION_NAME (versionCode $VERSION_CODE)"
          # Pick up anything pushed to the branch while the build was running.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git tag "$TAG"
          git push origin "HEAD:$GITHUB_REF_NAME" "refs/tags/$TAG"

      - name: Upload bundle to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: rocks.urzahil.iptv
          releaseFiles: dist/IPTV-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: alpha
          status: completed

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          gh release create "$TAG" \
            dist/*.apk \
            dist/IPTV-release.aab \
            --generate-notes \
            --title "IPTV $VERSION_NAME ($VERSION_CODE)"
